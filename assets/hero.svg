<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Kunal Somani — Robotics, Autonomous Systems, ML Infrastructure">
  <defs>
    <!-- background grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2430" stroke-width="0.5"/>
    </pattern>
    <!-- lidar sweep gradient (bright edge fading behind) -->
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <!-- thermal scanline gradient -->
    <linearGradient id="thermal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- typing reveal clip -->
    <clipPath id="typeclip">
      <rect x="300" y="90" height="70" width="0">
        <animate attributeName="width" from="0" to="420" dur="2.2s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

    /* cycling role lines: 12s loop, each visible ~3.4s */
    .role { opacity:0; animation: cyc 12s linear infinite; }
    .r2 { animation-delay: 4s; }
    .r3 { animation-delay: 8s; }
    @keyframes cyc {
      0%   { opacity:0 }
      4%   { opacity:1 }
      30%  { opacity:1 }
      34%  { opacity:0 }
      100% { opacity:0 }
    }

    .blip  { animation: ping 4s ease-out infinite; transform-origin: center; }
    .b2 { animation-delay: 1.3s; }
    .b3 { animation-delay: 2.6s; }
    @keyframes ping { 0% {opacity:0} 8% {opacity:1} 60% {opacity:0.15} 100% {opacity:0} }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.25} }

    @media (prefers-reduced-motion: reduce) {
      .role, .r2, .r3, .blip, .caret, .pulse { animation: none; opacity: 1; }
    }
  </style>

  <!-- base -->
  <rect width="900" height="300" fill="#0b0f14"/>
  <rect width="900" height="300" fill="url(#grid)"/>
  <circle cx="150" cy="150" r="150" fill="url(#glow)"/>

  <!-- HUD corner brackets -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M14 34 V14 H34"/>
    <path d="M866 14 H886 V34"/>
    <path d="M886 266 V286 H866"/>
    <path d="M34 286 H14 V266"/>
  </g>

  <!-- ===== radar (left) ===== -->
  <g>
    <circle cx="150" cy="150" r="115" fill="none" stroke="#1f2b3a" stroke-width="1"/>
    <circle cx="150" cy="150" r="82"  fill="none" stroke="#1f2b3a" stroke-width="1"/>
    <circle cx="150" cy="150" r="49"  fill="none" stroke="#1f2b3a" stroke-width="1"/>
    <circle cx="150" cy="150" r="16"  fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="150" x2="265" y2="150" stroke="#1f2b3a" stroke-width="1"/>
    <line x1="150" y1="35" x2="150" y2="265" stroke="#1f2b3a" stroke-width="1"/>

    <!-- rotating sweep wedge -->
    <path d="M150 150 L150 35 A115 115 0 0 1 207.5 50.4 Z" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="150" y1="150" x2="150" y2="35" stroke="#22d3ee" stroke-width="1.5" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- detected targets: cyan = visual, amber = thermal -->
    <circle class="blip"    cx="196" cy="108" r="3.5" fill="#22d3ee"/>
    <circle class="blip b2" cx="104" cy="188" r="3.5" fill="#f59e0b"/>
    <circle class="blip b3" cx="178" cy="196" r="3.5" fill="#22d3ee"/>
    <circle cx="150" cy="150" r="3" fill="#22d3ee"/>
  </g>

  <!-- ===== identity (right) ===== -->
  <text class="mono" x="300" y="78" font-size="13" letter-spacing="4" fill="#5b6b7d">ROBOTICS &#183; AI &#183; OPEN SOURCE</text>

  <g clip-path="url(#typeclip)">
    <text class="mono" x="300" y="138" font-size="46" font-weight="700" letter-spacing="1" fill="#e6edf3">KUNAL SOMANI</text>
  </g>
  <rect class="caret" x="642" y="104" width="4" height="40" fill="#22d3ee"/>

  <!-- cycling focus lines -->
  <g font-size="17" letter-spacing="5" fill="#f59e0b">
    <text class="mono role"    x="300" y="178">ROBOTICS × PERCEPTION</text>
    <text class="mono role r2" x="300" y="178">MULTIMODAL SENSOR FUSION</text>
    <text class="mono role r3" x="300" y="178">ML SYSTEMS &amp; INFRA</text>
  </g>

  <text class="mono" x="300" y="210" font-size="12.5" letter-spacing="1" fill="#5b6b7d">B.E. ROBOTICS &amp; AI — THAPAR   ·   B.S. DATA SCIENCE — IIT MADRAS</text>

  <!-- ===== bottom telemetry bar ===== -->
  <line x1="300" y1="238" x2="886" y2="238" stroke="#1f2b3a" stroke-width="1"/>
  <text class="mono" x="300" y="264" font-size="12" letter-spacing="1" fill="#7d8fa3">ROS 2 · Isaac Sim · PyTorch · FastAPI · CUDA</text>
  <circle class="pulse" cx="836" cy="259.5" r="4" fill="#34d399"/>

  <!-- thermal scanline drifting across full banner -->
  <rect width="900" height="2" fill="url(#thermal)">
    <animate attributeName="y" values="0;300;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
